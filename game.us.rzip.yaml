sha1: 774411742d25da14483b8bdc53b5a045b848f0dd
options:
  platform: n64
  basename: game
  target_path: assets/game.us.rzip.bin
  base_path: .
  asset_path: assets/game
  extensions_path: tools/splat_ext

  # This config splits only bin/rzip segments, so it can never populate the
  # 'referenced' flag that undefined_*_auto.txt is built from. Leaving these on
  # makes every run truncate the repo-root undefined_*_auto.txt to 0 bytes.
  create_undefined_funcs_auto: no
  create_undefined_syms_auto: no

segments:
  - name:  code
    type:  rzip
    xor:   0x8039CCCA
    start: 0x0
  - [0x144700, "bin", "code_padding"] # (almost) zero padding
  - name:  data
    type:  rzip
    start: 0x145ED8
    subsegments:
      - [0x145ED8, "compressed"] # compressed .data
  - [0x15A388, "bin", "data_padding"] # zero padding
  - [0x15C638] # 1,427,000 bytes
